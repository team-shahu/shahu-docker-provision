compose_project: shahu-docker-provision
doco_cd_dir: /home/ubuntu/doco-cd
data_volumes:
  - pg-18
  - keydb
  - caddy-data
  - caddy-config
  - mi-backups
sync_targets:
  - { src: "{{ old_checkout_dir }}/data/pg-18", volume: pg-18 }
  - { src: "{{ old_checkout_dir }}/data/keydb", volume: keydb }
  - { src: "{{ old_checkout_dir }}/data/caddy/data", volume: caddy-data }
  - { src: "{{ old_checkout_dir }}/data/caddy/config", volume: caddy-config }
  - { src: "/var/lib/docker/volumes/{{ old_compose_project | default(compose_project) }}_mi-backups/_data", volume: mi-backups }
data_services:
  - app
  - backup
  - db
  - keydb
server_hostname: shahu-ski
timezone: Asia/Tokyo
admin_user: mq1
admin_user_ssh_keys:
  - ssh-rsa 
ufw_ssh_allow_from:
  - 100.64.0.0/10
final: false
