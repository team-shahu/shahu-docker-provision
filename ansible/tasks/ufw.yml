- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH from trusted networks
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ ufw_ssh_allow_from }}"

- name: Allow Tailscale direct connections
  community.general.ufw:
    rule: allow
    port: "41641"
    proto: udp

- name: Allow outgoing by default
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Deny incoming by default and enable
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
